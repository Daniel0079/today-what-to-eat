<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今天該吃什麼</title>
<style>
  * { box-sizing: border-box; }
  :root {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #dfe4ea;
    --panel: #f4f6f8;
    --panel-strong: #e1e5ea;
    --steel-900: #1d232a;
    --steel-800: #2a3139;
    --steel-700: #3b4652;
    --steel-600: #556373;
    --steel-500: #78879a;
    --steel-300: #b9c2cf;
    --steel-100: #edf1f5;
    --accent: #c94d32;
    --accent-2: #e28043;
    --accent-3: #f0b15c;
    --good: #2e5e4d;
    --good-2: #3a7a5e;
    --danger: #a8312d;
    --shadow: rgba(18, 24, 30, 0.22);
    --shadow-soft: rgba(18, 24, 30, 0.12);
  }

  html, body { margin: 0; }
  body {
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
    background: linear-gradient(180deg, #dfe4ea 0%, #d4d9df 100%);
    color: var(--steel-900);
    line-height: 1.3;
  }

  body.dark {
    background: linear-gradient(180deg, #1a1e24 0%, #12161b 100%);
    color: #e8ecf0;
  }
  body.dark .location-box,
  body.dark .mood-panel,
  body.dark .recent-panel,
  body.dark .editor {
    background: rgba(255,255,255,0.06);
    border-color: #4a5562;
  }
  body.dark .location-input,
  body.dark .add input,
  body.dark .mood {
    background: rgba(255,255,255,0.08);
    color: #e8ecf0;
    border-color: #4a5562;
  }
  body.dark .sign-label { color: #f2d39d; }
  body.dark .list .name,
  body.dark .editor summary,
  body.dark .editor-title,
  body.dark .recent-title,
  body.dark .recent-status,
  body.dark .recent-item,
  body.dark .location-label,
  body.dark .mood-label,
  body.dark .history-summary {
    color: #e8ecf0;
  }
  body.dark .list li { border-top-color: #3a4450; }
  body.dark #history-summary { color: #b0b8c0; }

  main {
    max-width: 680px;
    margin: 0 auto;
    padding: 20px 16px 28px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .location-box {
    background: rgba(255,255,255,0.22);
    border: 3px solid var(--steel-700);
    border-radius: 16px;
    padding: 12px 14px 14px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 8px 18px rgba(31,36,42,0.08);
  }

  .location-label {
    display: block;
    margin: 0 0 8px;
    font-size: 1.28rem;
    font-weight: 800;
    color: var(--steel-900);
  }

  .location-input {
    width: 100%;
    min-height: 58px;
    font-size: 1.35rem;
    font-family: inherit;
    padding: 0 12px;
    border: 3px solid var(--steel-700);
    border-radius: 12px;
    background: rgba(255,255,255,0.75);
    color: var(--steel-900);
  }

  .sign {
    background: linear-gradient(180deg, #1e242a 0%, #11171d 100%);
    border: 5px solid #d4a15a;
    border-radius: 18px;
    padding: 20px 14px;
    min-height: 200px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 10px;
    box-shadow: 0 10px 24px var(--shadow-soft);
    position: sticky;
    top: 8px;
    z-index: 10;
  }

  .sign-label {
    margin: 0;
    font-size: 1.35rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: #f2d39d;
    text-transform: uppercase;
  }

  .sign-result {
    margin: 0;
    font-size: clamp(3.4rem, 15vw, 6.2rem);
    font-weight: 900;
    color: #ffe082;
    line-height: 1.05;
    overflow-wrap: anywhere;
    letter-spacing: 0.03em;
    text-shadow: 0 3px 0 rgba(0,0,0,0.45), 0 0 16px rgba(255, 224, 130, 0.6);
  }

  .sign-result.spinning {
    animation: slotSpin 0.12s linear infinite;
    filter: blur(0.4px);
    transform: scale(1.08);
    color: #fff8dc;
  }

  @keyframes slotSpin {
    0% { transform: translateY(-6px) scale(1.05); opacity: 0.7; }
    50% { transform: translateY(6px) scale(1.08); opacity: 1; }
    100% { transform: translateY(-6px) scale(1.05); opacity: 0.7; }
  }

  .mood-panel {
    background: rgba(255,255,255,0.22);
    border: 3px solid var(--steel-700);
    border-radius: 16px;
    padding: 12px 12px 10px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 8px 18px rgba(31,36,42,0.08);
  }

  .mood-label {
    display: block;
    margin: 0 0 10px;
    font-size: 1.15rem;
    font-weight: 800;
    color: var(--steel-900);
  }

  .mood-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .mood {
    min-height: 42px;
    padding: 0 14px;
    border: 2px solid var(--steel-700);
    border-radius: 999px;
    background: rgba(255,255,255,0.7);
    color: var(--steel-900);
    font-size: 1.05rem;
    font-weight: 800;
    cursor: pointer;
  }

  .mood[aria-pressed="true"] {
    background: linear-gradient(180deg, var(--good) 0%, var(--good-2) 100%);
    border-color: #8dd4b0;
    color: #f4fff7;
  }

  .cats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .cat:first-child, .cat:last-child { grid-column: 1 / -1; }

  button {
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease, background 0.12s ease;
  }

  .cat {
    min-height: 66px;
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--steel-100);
    background: linear-gradient(180deg, #3b4652 0%, #2f3842 100%);
    border: 3px solid #6f7f8f;
    border-radius: 14px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 4px 10px rgba(18, 24, 30, 0.12);
  }

  .cat[aria-pressed="true"] {
    background: linear-gradient(180deg, var(--good) 0%, var(--good-2) 100%);
    border-color: #8dd4b0;
    color: #f4fff7;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), 0 6px 16px rgba(42, 94, 77, 0.28);
  }

  .cat:active, .go:active, .add button:active, .del:active, .nearby:active, .mood:active {
    transform: scale(0.985);
  }

  .go {
    min-height: 100px;
    font-size: 2.2rem;
    font-weight: 900;
    color: #fff8f2;
    background: linear-gradient(180deg, var(--accent) 0%, #9d2d23 100%);
    border: 0;
    border-radius: 18px;
    box-shadow: 0 10px 22px rgba(154, 46, 31, 0.28), inset 0 1px 0 rgba(255,255,255,0.2);
    letter-spacing: 0.04em;
  }

  .nearby {
    display: block;
    width: 100%;
    min-height: 72px;
    font-size: 1.6rem;
    font-weight: 900;
    color: #fffdf9;
    background: linear-gradient(180deg, #214f45 0%, #0c2f2d 100%);
    border: 4px solid #b6d9c7;
    border-radius: 16px;
    box-shadow: 0 12px 22px rgba(14, 38, 34, 0.22), inset 0 1px 0 rgba(255,255,255,0.2);
    letter-spacing: 0.04em;
  }

  .recent-panel {
    background: rgba(255,255,255,0.22);
    border: 3px solid var(--steel-700);
    border-radius: 16px;
    padding: 12px 14px 14px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 8px 18px rgba(31,36,42,0.08);
  }

  .recent-title {
    margin: 0 0 8px;
    font-size: 1.15rem;
    font-weight: 800;
    color: var(--steel-900);
  }

  .recent-status {
    margin: 0 0 8px;
    font-size: 1rem;
    font-weight: 700;
    color: var(--steel-700);
  }

  .recent-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .recent-item {
    display: inline-flex;
    align-items: center;
    min-height: 40px;
    padding: 0 14px;
    border-radius: 999px;
    background: rgba(120, 135, 154, 0.18);
    border: 2px solid rgba(61, 72, 84, 0.3);
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--steel-900);
  }

  [hidden] { display: none !important; }

  .editor {
    border: 3px solid var(--steel-700);
    border-radius: 16px;
    padding: 0 14px 14px;
    background: rgba(255,255,255,0.18);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 8px 18px rgba(31,36,42,0.08);
    overflow: hidden;
  }

  .editor summary {
    padding: 16px 0;
    font-size: 1.55rem;
    font-weight: 800;
    cursor: pointer;
    color: var(--steel-900);
    list-style: none;
    position: relative;
  }

  .editor summary::-webkit-details-marker { display: none; }

  .editor summary::after {
    content: "▸";
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1.4rem;
    transition: transform 0.25s ease;
  }

  .editor[open] summary::after {
    transform: translateY(-50%) rotate(90deg);
  }

  .editor-content {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.35s ease;
  }

  .editor[open] .editor-content {
    grid-template-rows: 1fr;
  }

  .editor-inner {
    overflow: hidden;
  }

  .editor-title {
    margin: 8px 0 12px;
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--steel-700);
  }

  .add {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
  }

  .add input {
    min-height: 62px;
    min-width: 0;
    font-family: inherit;
    font-size: 1.45rem;
    padding: 0 12px;
    border: 3px solid var(--steel-700);
    border-radius: 12px;
    background: rgba(255,255,255,0.7);
    color: var(--steel-900);
  }

  .add button {
    min-height: 62px;
    padding: 0 20px;
    font-size: 1.5rem;
    font-weight: 800;
    color: #ffffff;
    background: linear-gradient(180deg, var(--steel-700) 0%, var(--steel-800) 100%);
    border: 0;
    border-radius: 12px;
    box-shadow: 0 8px 18px rgba(38,45,53,0.18);
  }

  .msg {
    min-height: 1.5em;
    margin: 12px 0 0;
    font-size: 1.2rem;
    font-weight: 800;
    color: var(--good);
  }

  .msg.err { color: var(--danger); }

  .list {
    list-style: none;
    margin: 10px 0 0;
    padding: 0;
  }

  .list li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-top: 2px solid var(--steel-300);
  }

  .list .name {
    flex: 1;
    min-width: 0;
    font-size: 1.8rem;
    font-weight: 700;
    overflow-wrap: anywhere;
    color: var(--steel-900);
  }

  .list .actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }

  .list .del {
    flex: none;
    min-height: 52px;
    padding: 0 18px;
    font-size: 1.3rem;
    font-weight: 800;
    color: #fff7f5;
    background: linear-gradient(180deg, var(--accent) 0%, #9d2d23 100%);
    border: 0;
    border-radius: 12px;
    box-shadow: 0 8px 18px rgba(154, 46, 31, 0.18);
  }

  .empty {
    margin: 10px 0 0;
    font-size: 1.3rem;
    color: var(--steel-700);
    font-weight: 700;
  }

  :focus-visible {
    outline: 4px solid #d7ad59;
    outline-offset: 3px;
  }

  @media (min-width: 600px) {
    .sign-label { font-size: 1.6rem; }
    .cat { min-height: 72px; font-size: 1.8rem; }
    .go { min-height: 110px; font-size: 2.7rem; }
  }
</style>
</head>
<body>
<main>
  <div class="location-box" style="display:flex; justify-content:space-between; align-items:center; padding:10px 14px;">
    <span style="font-weight:800; font-size:1.1rem;">今天該吃什麼</span>
    <button type="button" id="theme-btn" class="mood" style="min-height:40px; padding:0 14px;">深色模式</button>
  </div>

  <div class="location-box">
    <details>
      <summary class="location-label" style="cursor:pointer; list-style:none; margin-bottom:0;">你現在在哪裡？（選填）</summary>
      <input class="location-input" id="location-input" type="text" placeholder="例如：鳳山站" aria-label="你現在在哪裡" style="margin-top:8px;">
    </details>
  </div>

  <section class="sign" aria-live="polite">
    <p class="sign-label" id="label">選好種類，再按下面的大按鈕</p>
    <p class="sign-result" id="result">今天該吃什麼</p>
    <img id="result-img" alt="" style="display:none; width:100%; max-width:320px; height:180px; object-fit:cover; border-radius:12px; margin:10px auto 0; border:3px solid #d4a15a;">
    <p id="fortune-tip" style="margin:8px 0 0; font-size:1.05rem; color:#f2d39d; min-height:1.4em;"></p>
  </section>

  <div class="mood-panel">
    <details>
      <summary class="mood-label" style="cursor:pointer; list-style:none;">進階篩選（心情／體感）</summary>
      <p class="mood-label" style="margin-top:10px;">今天想吃什麼感覺？</p>
      <div class="mood-list" id="moods">
        <button class="mood" type="button" data-mood="all" aria-pressed="true">隨機</button>
        <button class="mood" type="button" data-mood="light" aria-pressed="false">清爽</button>
        <button class="mood" type="button" data-mood="heavy" aria-pressed="false">重口味</button>
        <button class="mood" type="button" data-mood="cheap" aria-pressed="false">便宜</button>
        <button class="mood" type="button" data-mood="healthy" aria-pressed="false">健康</button>
      </div>
      <label class="location-label" style="margin-top:12px;">目前體感如何？</label>
      <div class="mood-list" id="feels-options" style="margin-top:6px;">
        <button type="button" class="mood feels-btn" data-feels="cold" aria-pressed="false">很冷</button>
        <button type="button" class="mood feels-btn" data-feels="cool" aria-pressed="false">偏冷</button>
        <button type="button" class="mood feels-btn" data-feels="normal" aria-pressed="true">舒適</button>
        <button type="button" class="mood feels-btn" data-feels="hot" aria-pressed="false">偏熱</button>
        <button type="button" class="mood feels-btn" data-feels="veryhot" aria-pressed="false">很熱</button>
      </div>
      <button type="button" id="detect-temp-btn" class="del" style="margin-top:10px; width:100%; min-height:48px; font-size:1.15rem; background:linear-gradient(180deg,#5dade2 0%,#3498db 100%); color:#ffffff; border:0;">自動偵測體感</button>
      <p id="temp-status" style="margin:6px 0 0; font-size:0.95rem; color:#556373;"></p>
    </details>
  </div>

  <div class="cats" id="cats">
    <button class="cat" data-cat="all" aria-pressed="true">什麼都可以</button>
    <button class="cat" data-cat="早餐" aria-pressed="false">早餐</button>
    <button class="cat" data-cat="午晚餐" aria-pressed="false">午晚餐</button>
    <button class="cat" data-cat="小吃" aria-pressed="false">小吃</button>
    <button class="cat" data-cat="甜點" aria-pressed="false">甜點</button>
    <button class="cat" data-cat="飲料" aria-pressed="false">飲料</button>
  </div>

  <button class="go" id="go">幫我決定</button>

  <div class="recent-panel" aria-live="polite">
    <p class="recent-title">最近紀錄</p>
    <p class="recent-status" id="recent-status">還沒抽過，先讓命運決定！</p>
    <ul class="recent-list" id="recent-list"></ul>
    <p id="history-summary" style="margin:10px 0 0; font-size:0.95rem; color:#556373;"></p>
    <button type="button" id="clear-history-btn" class="del" style="margin-top:10px; width:100%; min-height:44px; font-size:1.1rem; background:linear-gradient(180deg,#78879a 0%,#556373 100%);" hidden>清除歷史紀錄</button>
  </div>

  <div id="action-buttons" style="display:flex; gap:10px; flex-wrap:wrap;">
    <button class="nearby" id="nearby" hidden style="flex:1; min-height:72px; font-size:1.5rem;">找附近的店</button>
    <button class="nearby" id="copy-btn" hidden style="flex:1; min-height:72px; font-size:1.5rem; background:linear-gradient(180deg,#5dade2 0%,#3498db 100%); border-color:#aed6f1;">複製結果</button>
  </div>

  <details class="editor" id="editor">
    <summary>新增或刪掉選項</summary>
    <div class="editor-content">
      <div class="editor-inner">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:8px 0 14px;">
          <button type="button" id="export-btn" class="del" style="min-height:48px; font-size:1.15rem; background:linear-gradient(180deg,#5dade2 0%,#3498db 100%); color:#ffffff;">匯出選單</button>
          <button type="button" id="import-btn" class="del" style="min-height:48px; font-size:1.15rem; background:linear-gradient(180deg,#5dade2 0%,#3498db 100%); color:#ffffff;">匯入選單</button>
        </div>
        <p class="editor-title" id="editor-title"></p>
        <form class="add" id="add-form" autocomplete="off">
          <input type="text" id="new-item" maxlength="20" placeholder="輸入新的選項" aria-label="新的選項名稱">
          <button type="submit">新增</button>
        </form>
        <p class="msg" id="msg" aria-live="polite"></p>
        <ul class="list" id="list"></ul>
        <p class="empty" id="empty" hidden>這一類目前沒有選項，請先新增。</p>
        <button type="button" id="reset-btn" class="del" style="margin-top: 16px; width: 100%; min-height: 56px; font-size: 1.3rem;">重置為預設選單</button>
      </div>
    </div>
  </details>
</main>

      "蔬菜蛋餅", "煎餃", "鍋貼", "蛋餅加起司", "鮪魚蛋餅", "火腿蛋餅"

  function loadMenu() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      var data = JSON.parse(raw);
      var saved = {};
      for (var i = 0; i < CATS.length; i++) {
        var items = data[CATS[i]];
        if (!Array.isArray(items)) return null;
        saved[CATS[i]] = items.filter(function (x) { return typeof x === "string"; });
      }
      return saved;
    } catch (e) {
      return null;
    }
  }

  function loadRecentHistory() {
    try {
      var raw = localStorage.getItem(RECENT_KEY);
      if (!raw) return [];
      var data = JSON.parse(raw);
      if (!Array.isArray(data)) return [];
      return data.map(function (x) {
        if (typeof x === "string") return { name: x, date: "" };
        if (x && typeof x.name === "string") return { name: x.name, date: x.date || "" };
        return null;
      }).filter(Boolean).slice(0, 10);
    } catch (e) {
      return [];
    }
  }

  function detectFeelsLike() {
    var statusEl = document.getElementById("temp-status");
    statusEl.textContent = "正在取得位置...";

    if (!navigator.geolocation) {
      statusEl.textContent = "這個瀏覽器不支援定位";
      return;
    }

    navigator.geolocation.getCurrentPosition(
      function (pos) {
        var lat = pos.coords.latitude;
        var lon = pos.coords.longitude;
        statusEl.textContent = "正在查詢體感溫度...";

        fetch("https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon + "&current=apparent_temperature")
          .then(function (res) { return res.json(); })
          .then(function (data) {
            var feels = data.current && data.current.apparent_temperature;
            if (typeof feels !== "number") {
              statusEl.textContent = "無法取得體感溫度";
              return;
            }
            var rounded = Math.round(feels);
            var level = "normal";
            var label = "舒適";
            if (rounded <= 15) { level = "cold"; label = "很冷"; }
            else if (rounded <= 20) { level = "cool"; label = "偏冷"; }
            else if (rounded >= 34) { level = "veryhot"; label = "很熱"; }
            else if (rounded >= 29) { level = "hot"; label = "偏熱"; }
            selectFeels(level);
            statusEl.textContent = "已自動選擇：" + label + "（體感 " + rounded + "°C）";
          })
          .catch(function () {
            statusEl.textContent = "查詢失敗，請稍後再試";
          });
      },
      function (err) {
        statusEl.textContent = err.code === 1 ? "已拒絕定位權限" : "無法取得位置";
      },
      { enableHighAccuracy: false, timeout: 8000 }
    );
  }

  function applyTemperatureFilter(pool) {
    var preferred = [];
    if (currentFeels === "veryhot" || currentFeels === "hot") {
      preferred = pool.filter(function (item) {
        return /(涼|冰|豆花|剉冰|沙拉|茶|水果|西瓜|芒果|優格|清粥|燕麥)/.test(item);
      });
    } else if (currentFeels === "cold" || currentFeels === "cool") {
      preferred = pool.filter(function (item) {
        return /(火鍋|湯|麵|牛肉|羊肉|薑母|麻辣|鍋|熱|粥|便當|滷)/.test(item);
      });
    }
    return preferred.length > 0 ? preferred : pool;
  }

  function filterByMood(pool) {
    if (mood === "all") return pool;
    var rule = MOOD_RULES[mood] || MOOD_RULES.all;
    var filtered = pool.filter(function (item) {
      return rule(item);
    });
    return filtered.length > 0 ? filtered : pool;
  }

  var isSpinning = false;

  function playTick() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    var types = ["square", "triangle", "sawtooth"];
    osc.type = types[Math.floor(Math.random() * types.length)];
    osc.frequency.value = 160 + Math.random() * 120;
    gain.gain.setValueAtTime(0.06 + Math.random() * 0.04, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06 + Math.random() * 0.04);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
  }

  function playDing() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = Math.random() > 0.5 ? "sine" : "triangle";
    var base = 480 + Math.random() * 80;
    osc.frequency.setValueAtTime(base, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(base * 1.5, audioCtx.currentTime + 0.18);
    gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.45);
  }

  document.getElementById("go").addEventListener("click", function () {
    if (isSpinning) return;

    var pool = category === "all"
      ? [].concat(MENU["早餐"], MENU["午晚餐"], MENU["小吃"], MENU["甜點"], MENU["飲料"])
      : MENU[category];

      currentPick = null;
      document.getElementById("copy-btn").hidden = true;
      return;
    }

    var moodFiltered = filterByMood(pool);
    var tempFiltered = applyTemperatureFilter(moodFiltered);
    var recentBlocked = recentHistory.slice(0, 5).map(function (x) { return (x && x.name) ? x.name : x; });
    var choices = tempFiltered.filter(function (item) {
      return recentBlocked.indexOf(item) === -1 && excludedList.indexOf(item) === -1;
    });
    if (choices.length === 0) choices = tempFiltered.filter(function (item) {
      return excludedList.indexOf(item) === -1;
    });
    if (choices.length === 0) choices = tempFiltered;

    var poolAfterLastPick = choices.filter(function (item) { return item !== lastPick; });
    if (poolAfterLastPick.length > 0) choices = poolAfterLastPick;

    if (choices.length === 0) {
      labelEl.textContent = "沒有可抽的選項";
      resultEl.textContent = "請調整排除或分類";
      return;
    }

    var pick = choices[Math.floor(Math.random() * choices.length)];

    // 老虎機動畫
    isSpinning = true;
    document.getElementById("go").style.opacity = "0.6";
    document.getElementById("go").style.pointerEvents = "none";
    labelEl.textContent = "抽選中...";

    var img = document.getElementById("result-img");

    var tipEl = document.getElementById("fortune-tip");
    if (tipEl) tipEl.textContent = "";
    resultEl.classList.add("spinning");

    var spinPool = choices.slice();
    var spinCount = 0;
    var maxSpins = 20 + Math.floor(Math.random() * 10);
    var interval = 40;

    function spin() {
      if (spinCount >= maxSpins) {
        // 停在最終結果
        resultEl.classList.remove("spinning");
        resultEl.style.transform = "scale(1.15)";
        resultEl.textContent = pick;
        labelEl.textContent = "今天吃";

        addRecentPick(pick);
        nearbyBtn.hidden = false;

          img.style.display = "block";
          img.alt = pick;
          img.src = "https://loremflickr.com/400/300/" + encodeURIComponent(pick) + ",food";
        }
        isSpinning = false;
        document.getElementById("go").style.opacity = "";
        document.getElementById("go").style.pointerEvents = "";
        playDing();
        // 隨機小建議
        var tips = [
          "記得配一杯無糖茶",
          "今天適合慢慢吃",
          "吃完可以散個步",
          "別忘了喝水",
          "今天可以早點休息",
          "吃飽了就好，別太撐",
          "如果很忙，可以外帶",
          "記得看一下營業時間"
        ];
        var tip = tips[Math.floor(Math.random() * tips.length)];
        var tipEl = document.getElementById("fortune-tip");
        if (tipEl) tipEl.textContent = tip;
        // 自動語音播報
        if (window.speechSynthesis) {
          window.speechSynthesis.cancel();
          var phrases = [
            "好啦，今天就吃" + pick + "吧",
            "嗯...今天吃" + pick + "好了",
            "那就" + pick + "吧，決定了",
            "今天就來" + pick + "啊",
            "好，" + pick + "，就這樣",
            "今天吃" + pick + "，沒問題"
          ];
          var text = phrases[Math.floor(Math.random() * phrases.length)];
          var utter = new SpeechSynthesisUtterance(text);
          utter.lang = "zh-TW";
          utter.rate = 0.9;
          utter.pitch = 1.08;
          var voices = window.speechSynthesis.getVoices();
          var zhVoice = voices.filter(function (v) { return v.lang && v.lang.indexOf("zh") === 0; })[0];
          if (zhVoice) utter.voice = zhVoice;
          window.speechSynthesis.speak(utter);
        }
        setTimeout(function () {
          resultEl.style.transform = "";
        }, 300);
        return;
      }

      // 隨機顯示一個選項 + 音效
      var randomItem = spinPool[Math.floor(Math.random() * spinPool.length)];
      resultEl.textContent = randomItem;
      playTick();
      spinCount++;

      // 越來越慢
      if (spinCount > maxSpins - 5) interval += 60;
      else if (spinCount > maxSpins - 10) interval += 20;

      setTimeout(spin, interval);
    }

    spin();
  });

  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;

    ta.select();

      var btn = document.getElementById("copy-btn");
      var original = btn.textContent;
      btn.textContent = "已複製！";

      if (excludedList.indexOf(name) !== -1) {
        span.style.opacity = "0.5";
        span.style.textDecoration = "line-through";
      }

      var actions = document.createElement("div");
      actions.className = "actions";

      var excludeBtn = document.createElement("button");
      excludeBtn.type = "button";
      excludeBtn.className = "del";
      excludeBtn.style.background = excludedList.indexOf(name) !== -1
        ? "linear-gradient(180deg, #556373 0%, #3b4652 100%)"
        : "linear-gradient(180deg, #a8312d 0%, #7a241f 100%)";
      excludeBtn.textContent = excludedList.indexOf(name) !== -1 ? "取消排除" : "排除";
      excludeBtn.setAttribute("aria-label", (excludedList.indexOf(name) !== -1 ? "取消排除 " : "排除 ") + name);
      excludeBtn.addEventListener("click", function () {
        var idx = excludedList.indexOf(name);
        if (idx === -1) {
          excludedList.push(name);
        } else {
          excludedList.splice(idx, 1);
        }
        saveExcluded();
        renderEditor();
        showMsg(excludedList.indexOf(name) !== -1 ? "已排除：" + name : "已取消排除：" + name, false, true);
      });

      var del = document.createElement("button");
      del.type = "button";
      del.className = "del";
      del.textContent = "刪掉";
      del.setAttribute("aria-label", "刪掉 " + name);
      del.addEventListener("click", function () { removeItem(index); });

      actions.appendChild(excludeBtn);
      actions.appendChild(del);
      li.appendChild(span);
      li.appendChild(actions);
      listEl.appendChild(li);
    });
  }

  var SKIP_DELETE_CONFIRM_KEY = "today-what-to-eat-skip-delete-confirm";

  function shouldSkipDeleteConfirm() {
    try {
      return localStorage.getItem(SKIP_DELETE_CONFIRM_KEY) === "1";
    } catch (e) {
      return false;
    }
  }

  function setSkipDeleteConfirm() {
    try {
      localStorage.setItem(SKIP_DELETE_CONFIRM_KEY, "1");
    } catch (e) {}
  }

  function removeItem(index) {
    var name = MENU[category][index];
    if (!name) return;

    if (!shouldSkipDeleteConfirm()) {
      if (!confirm("確定要刪掉「" + name + "」嗎？")) return;
      if (confirm("下次刪除時還要再問一次嗎？\n（按「取消」就不再詢問）")) {
        // 使用者選「確定」→ 下次還要問
      } else {
        setSkipDeleteConfirm();
        showMsg("已設定：刪除時不再詢問", false, true);
      }
    }

    MENU[category].splice(index, 1);
    var saved = saveMenu();
    renderEditor();
    showMsg("已刪掉：" + name, false, saved);
  }

  document.getElementById("export-btn").addEventListener("click", function () {
    var data = JSON.stringify(MENU, null, 2);
    var blob = new Blob([data], { type: "application/json;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "今天該吃什麼-選單.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 100);
    showMsg("已下載選單檔案", false, true);
  });

  document.getElementById("import-btn").addEventListener("click", function () {
    var input = document.createElement("input");
    input.type = "file";
    input.accept = ".json,application/json";
    input.onchange = function () {
      var file = input.files && input.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function (e) {
        try {
          var data = JSON.parse(e.target.result);
          var valid = true;
          CATS.forEach(function (cat) {
            if (!Array.isArray(data[cat])) valid = false;
          });
          if (!valid) throw new Error("格式不正確");
          MENU = data;
          var saved = saveMenu();
          renderEditor();
          showMsg("已從檔案匯入選單", false, saved);
        } catch (err) {
          showMsg("匯入失敗，請確認是正確的選單 JSON 檔", true);
        }
      };
      reader.readAsText(file);
    };
    input.click();
  });

  document.getElementById("reset-btn").addEventListener("click", function () {
    if (!confirm("確定要重置為預設選單嗎？\n這會清除所有自訂的選項與最近抽到的紀錄。")) return;
    try {
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(RECENT_KEY);
      localStorage.removeItem(EXCLUDED_KEY);
      localStorage.removeItem(SKIP_DELETE_CONFIRM_KEY);
    } catch (e) {}
    MENU = JSON.parse(JSON.stringify(DEFAULT_MENU));
    recentHistory = [];
    excludedList = [];
    lastPick = null;
    currentPick = null;
    nearbyBtn.hidden = true;
    labelEl.textContent = "選好種類，再按下面的大按鈕";
    resultEl.textContent = "今天該吃什麼";
    var img = document.getElementById("result-img");
    if (img) img.style.display = "none";
    document.getElementById("copy-btn").hidden = true;
    updateRecentDisplay();
    renderEditor();
    showMsg("已重置為預設選單", false, true);
  });

  addForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var name = newItemEl.value.trim();
    if (!name) {
      showMsg("請先輸入名字", true);
      return;
    }
    if (MENU[category].indexOf(name) !== -1) {
      showMsg("「" + name + "」已經有了", true);
      return;
    }
    MENU[category].unshift(name);
    var saved = saveMenu();
    newItemEl.value = "";
    renderEditor();
    showMsg("已新增：" + name, false, saved);
  });

  var THEME_KEY = "today-what-to-eat-theme";

  function applyTheme() {
    var isDark = localStorage.getItem(THEME_KEY) === "dark";
    document.body.classList.toggle("dark", isDark);
    var btn = document.getElementById("theme-btn");
    if (btn) btn.textContent = isDark ? "淺色模式" : "深色模式";
  }

  document.getElementById("theme-btn").addEventListener("click", function () {
    var isDark = document.body.classList.contains("dark");
    localStorage.setItem(THEME_KEY, isDark ? "light" : "dark");
    applyTheme();
  });

  applyTheme();
  autoSelectCategory();
  updateRecentDisplay();
  renderEditor();
</script>
</body>
</html>
